  # ─── CROSS-CUTTING ERROR / EDGE-CASE HANDLING ────────────────────────

  - id: UC-33
    title: Any request without a valid JWT is rejected
    category: backend
    actors: [guest]
    tickets: [SAHYOG-04]
    preconditions:
      - Request has no Authorization header, or an invalid/expired one.
    trigger: Any call to a protected endpoint.
    main_flow:
      - app/deps.py's get_current_user dependency raises 401 UNAUTHENTICATED before any route logic runs.
    postconditions:
      - No data read or written.
    related:
      frontend: [App.jsx route guards pre-empt most of these in the UI]
      backend_endpoints: [every endpoint except POST /auth/register, POST /auth/login]

  - id: UC-34
    title: User attempts an action outside their role or ownership
    category: backend
    actors: [rider, coordinator]
    tickets: [SAHYOG-05, SAHYOG-15, SAHYOG-17, SAHYOG-18, SAHYOG-20, SAHYOG-46]
    preconditions:
      - Caller is authenticated but is either the wrong role for the endpoint, or not the owner of the specific resource.
    trigger: E.g. a rider calling POST /trips, or a coordinator viewing another coordinator's passenger list, or a rider releasing someone else's hold.
    main_flow:
      - Role checks -> 403 FORBIDDEN_ROLE. Ownership checks (hold/reservation/trip belongs to someone else) -> 403 NOT_OWNER.
    postconditions:
      - No data read or written beyond what the error itself reveals (nothing sensitive).
    related:
      frontend: [ErrorState.jsx renders these consistently]
      backend_endpoints: [POST /trips, GET /trips/mine, "DELETE /holds/{id}", POST /reservations, "POST /reservations/{id}/cancel", "GET /trips/{id}/passengers", "PUT /trips/{id}/stops", "PATCH /trips/{id}/stops/current", "POST /trips/{id}/seat-recommendation"]

  - id: UC-35
    title: User references a resource that doesn't exist
    category: backend
    actors: [rider, coordinator]
    tickets: []
    preconditions:
      - Path ID (trip/hold/reservation/seat) doesn't exist in the database.
    trigger: E.g. a stale bookmark to a deleted/never-existing trip ID.
    main_flow:
      - The relevant service raises 404 NOT_FOUND before any mutation.
    postconditions:
      - No data read or written.
    related:
      frontend: [ErrorState.jsx with retry]
      backend_endpoints: ["GET /trips/{id}", "GET /trips/{id}/passengers", "POST /trips/{id}/seat-recommendation", "GET /trips/{id}/similar", "PUT /trips/{id}/stops", "PATCH /trips/{id}/stops/current", POST /holds, "DELETE /holds/{id}", POST /reservations, "POST /reservations/{id}/cancel"]

  - id: UC-36
    title: A request fails schema validation
    category: full-stack
    actors: [guest, rider, coordinator]
    tickets: []
    preconditions:
      - Request body/query params don't satisfy the Pydantic schema (missing required field, out-of-range value, wrong type).
    trigger: E.g. registering with a 6-character password, creating a trip with total_seats=0, or confirming a reservation with a 3-digit phone number.
    main_flow:
      - FastAPI's validation layer raises 422 VALIDATION_ERROR with the specific offending field name in the error envelope.
      - Frontend forms surface this inline next to the relevant field where practical, or as a general ErrorState otherwise.
    postconditions:
      - No data written.
    related:
      frontend: [every form: Register.jsx, Login.jsx, CreateTrip.jsx, TripDetail.jsx (confirm form), ManageStops.jsx]
      backend_endpoints: [every POST/PUT/PATCH endpoint]
